<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet"> -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"> -->

</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>To-Do List <img src="images/todoicon.jpg" alt=""></h2>
            <div class="row">
                <input type=" text" id="input-box" placeholder="Add your text">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="list-container">
                <!-- <li class="checked">Task 1</li>
                <li>Task 2</li>
                <li>Task 3</li> -->
            </ul>
        </div>

    </div>

<audio id="clickSound" src="click.mp3" preload="auto"></audio>
<script src="script.js"></script>
<script>
    window.addEventListener('load', function () {
      const img = document.querySelector('.todo-app h2 img');
      img.classList.add('animate-once');
      
      setTimeout(() => {
        img.classList.remove('animate-once');
        img.classList.add('gentle-pulse');
  
        // Stop gentle pulse after 3 seconds
        setTimeout(() => {
          img.classList.remove('gentle-pulse');
        }, 20000);
  
      }, 4000); // Wait until floatRotate finishes
    });


    window.addEventListener('load', () => {
      const img = document.querySelector('.todo-app h2 img');
      img.classList.add('animate-once');
  
      img.addEventListener('animationend', () => {
        img.classList.remove('animate-once');
        img.classList.add('gentle-pulse');
      });
    });


    const clickSound = document.getElementById("clickSound");
    const addButton = document.querySelector("button");

    addButton.addEventListener("click", () => {
        clickSound.currentTime = 0; 
        clickSound.play();
    });
</script>
</body>
</html>
